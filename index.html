    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HajjCare">
    <meta name="theme-color" content="#F9FAFB">
    
    <!-- Branding Metadata -->
    <meta name="author" content="w3jdev">
    <meta property="og:site_name" content="HajjCare by w3jdev">
    <meta property="og:title" content="HajjCare - AI Pilgrim Companion">
    <meta property="og:description" content="An accessibility-focused companion app for elderly Hajj pilgrims. Crafted by w3jdev.">
    
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3659/3659837.png">
    <title>HajjCare | by w3jdev</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#2ECC71', // Islamic Green
              secondary: '#3498DB', // Sky Blue
              accent: '#F39C12', // Warm Gold
              alert: '#E74C3C', // Red
              success: '#27AE60', // Dark Green
              dark: '#2C3E50', // Text
              gray: {
                DEFAULT: '#ECF0F1', // Background/Cards
                50: '#F9FAFB',
                100: '#F3F4F6',
                200: '#E5E7EB',
                300: '#D1D5DB',
                400: '#9CA3AF',
                500: '#6B7280',
                600: '#4B5563',
                700: '#374151',
                800: '#1F2937',
                900: '#111827',
              }
            },
            fontFamily: {
              bengali: ['"Noto Sans Bengali"', 'sans-serif'],
              arabic: ['"Noto Naskh Arabic"', 'serif'],
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'bounce-slow': 'bounce 2s infinite',
              'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
              'slide-down': 'slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
              'fade-in': 'fadeIn 0.3s ease-out',
            },
            keyframes: {
              slideUp: {
                '0%': { transform: 'translateY(100%)' },
                '100%': { transform: 'translateY(0)' },
              },
              slideDown: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              }
            }
          },
        },
      }
    </script>
    <style>
      /* Native App Feel Resets */
      body {
        font-family: 'Noto Sans Bengali', sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
        overscroll-behavior-y: none; /* Disables browser pull-to-refresh */
        background-color: #F9FAFB;
      }
      
      .dark body {
        background-color: #111827;
        color: #F9FAFB;
      }
      
      /* Smooth Scrolling for Content */
      .native-scroll {
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
        overscroll-behavior-y: contain;
      }

      .font-arabic {
        font-family: 'Noto Naskh Arabic', serif;
      }
      
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top);
      }

      /* Glassmorphism Utilities */
      .glass {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(0,0,0,0.05);
      }
      .dark .glass {
        background: rgba(17, 24, 39, 0.85);
        border-bottom: 1px solid rgba(255,255,255,0.05);
      }

      .glass-nav {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid rgba(0,0,0,0.05);
      }
      .dark .glass-nav {
        background: rgba(17, 24, 39, 0.9);
        border-top: 1px solid rgba(255,255,255,0.05);
      }

      /* Custom scrollbar hiding */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Map specific styles */
      .leaflet-container {
        width: 100%;
        height: 100%;
        z-index: 10;
        background: transparent !important; /* Transparent for skybox visibility */
      }
      
      /* Marker Styles */
      .custom-marker {
        transition: transform 0.2s ease;
      }
      .custom-marker:hover {
        transform: scale(1.1);
      }
      
      /* Better touch targets */
      button, a {
        cursor: pointer;
        touch-action: manipulation;
      }
    </style>
  <script type="importmap">
{
  "imports": {

    "fast-deep-equal": "https://esm.sh/fast-deep-equal@3.1.3",

  }
}
</script>
</head>
